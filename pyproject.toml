[project]
name = "ai-cost-control"
version = "0.1.0"
description = "Two Microsoft Agent Framework agents served over streaming A2A"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "agent-framework-a2a==1.0.0b261015",
    "a2a-sdk[http-server]==1.2.3",
    "azure-core[aio]>=1.31,<2",
    "azure-identity>=1.25,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b35,<2",
    "httpx>=0.28,<1",
    "opentelemetry-sdk>=1.35,<2",
    "python-dotenv>=1,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "debugpy>=1.8,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    { include-group = "finops" },
]
finops = [
    "azure-monitor-query>=1.4,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
